<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Расходы</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<div id="app">

  <header class="app-header">
    <span class="app-header__title" id="header-title">Расходы</span>
    <div class="app-header__actions">
      <button id="open-settings" class="icon-btn">⚙️</button>
      <button id="open-map" class="icon-btn">🗺</button>
      <button id="open-calendar" class="icon-btn">📅</button>
    </div>
  </header>

  <div class="period-tabs">
    <button class="period-tab" data-period="week">Нед</button>
    <button class="period-tab active" data-period="month">Мес</button>
    <button class="period-tab" data-period="year">Год</button>
  </div>

  <div class="period-nav">
    <button id="prev-period" class="nav-btn">‹</button>
    <span id="period-label" class="period-nav__label">Август 2026</span>
    <button id="next-period" class="nav-btn">›</button>
  </div>

  <div class="summary">
    <div class="summary__total" id="period-total">0.00</div>
    <select id="base-currency" class="currency-select"></select>
  </div>

  <div class="donut-wrap">
    <svg id="donut-svg" class="donut" viewBox="0 0 200 200"></svg>
    <div class="donut-center" id="donut-center-label"></div>
  </div>

  <div class="category-pills" id="category-pills"></div>

  <div class="entries-block">
    <h2 class="block-title">Последние траты</h2>
    <div id="entries-list" class="entries-list"></div>
  </div>

</div>

<div id="calendar-screen" class="screen hidden">
  <header class="topbar">
    <button id="calendar-back" class="nav-btn">←</button>
    <div class="month-nav">
      <button id="prev-cal-month" class="nav-btn">‹</button>
      <span id="calendar-month-label" class="month-nav__label">Август 2026</span>
      <button id="next-cal-month" class="nav-btn">›</button>
    </div>
    <span class="nav-spacer"></span>
  </header>

  <div class="calendar" id="calendar"></div>

  <div class="entries-block">
    <h2 class="block-title" id="calendar-entries-title">Все траты за месяц</h2>
    <div id="calendar-entries-list" class="entries-list"></div>
  </div>
</div>

<div id="settings-screen" class="screen hidden">
  <header class="topbar">
    <button id="settings-back" class="nav-btn">←</button>
    <div class="topbar__title">Настройки</div>
    <span class="nav-spacer"></span>
  </header>

  <div class="field">
    <label>Имя</label>
    <input id="settings-name" type="text" placeholder="Как к тебе обращаться">
  </div>

  <div class="field">
    <label>Начальный экран</label>
    <div class="period-tabs" id="settings-start-screen">
      <button class="period-tab" data-value="overview">Обзор</button>
      <button class="period-tab" data-value="calendar">Календарь</button>
    </div>
  </div>

  <div class="field">
    <label>Тема</label>
    <div class="period-tabs" id="settings-theme">
      <button class="period-tab" data-value="auto">Авто</button>
      <button class="period-tab" data-value="dark">Тёмная</button>
      <button class="period-tab" data-value="light">Светлая</button>
    </div>
  </div>

</div>

<div id="map-screen" class="screen hidden">
  <header class="topbar">
    <button id="map-back" class="nav-btn">←</button>
    <div class="topbar__title">Карта сообщества</div>
    <span class="nav-spacer"></span>
  </header>
  <div id="map-container"></div>
  <p class="map-hint">Места, которыми поделились пользователи — цена усреднена по всем отметкам</p>
</div>

<button id="fab-add" class="fab">+</button>

<div id="add-overlay" class="overlay hidden">
  <div class="sheet">
    <h2>Новая трата</h2>

    <div class="field">
      <label>Сумма</label>
      <input id="input-amount" type="number" inputmode="decimal" placeholder="0.00" step="0.01">
    </div>

    <div class="field-row">
      <div class="field">
        <label>Валюта</label>
        <select id="input-currency"></select>
      </div>
      <div class="field">
        <label>Дата</label>
        <input id="input-date" type="date">
      </div>
    </div>

    <div class="field">
      <label>Категория</label>
      <div id="category-picker" class="category-picker"></div>
    </div>

    <div class="field">
      <label>Заметка (необязательно)</label>
      <input id="input-note" type="text" placeholder="Например: обед в кафе">
    </div>

    <div class="field">
      <label>Место (необязательно)</label>
      <input id="input-place" type="text" placeholder="Название кафе/магазина">
    </div>

    <div class="share-row">
      <label class="share-toggle">
        <input id="input-share" type="checkbox">
        <span>📍 Поделиться местом с картой сообщества</span>
      </label>
    </div>

    <div class="sheet-actions">
      <button id="cancel-add" class="btn btn--ghost">Отмена</button>
      <button id="confirm-add" class="btn btn--primary">Добавить</button>
    </div>
  </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
